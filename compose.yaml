services:
  app:
    image: ${APP_IMAGE:?Nastavte APP_IMAGE na adresu image v GHCR}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:4251:8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
