[project]
name = "hkfree-tv"
version = "0.1.0"
description = "Identifikace clenu hkfree pres userdb API a presmerovani do SledovaniTV"
readme = "readme.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "waitress>=3.0.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
