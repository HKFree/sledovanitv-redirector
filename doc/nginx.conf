# Nginx bezi primo na Docker hostiteli; verejni klienti se pripojuji primo k nemu.
# Vlozit do http {} (napr. /etc/nginx/sites-available/hkfree-tv.conf).
# Nahradit tv.example.org skutecnou domenou a upravit cesty k TLS certifikatu.
# Postup a TRUSTED_PROXY: nginx.md ve stejne slozce.

server {
    listen 80;
    listen [::]:80;
    server_name tv.example.org;

    return 308 https://tv.example.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tv.example.org;

    ssl_certificate /etc/letsencrypt/live/tv.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tv.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:4251;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # Vzdy prepsat hodnotou skutecneho TCP klienta nginxu.
        # Nepripojovat klientem dodanou X-Forwarded-For.
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 60s;
        proxy_cache off;
        proxy_intercept_errors off;
        proxy_redirect off;
    }
}
