name: Tests and container

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.29"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --no-sync pytest
      - name: Validate Compose configuration
        env:
          APP_IMAGE: ghcr.io/example/hkfree-tv:ci
        run: |
          cp .env.example .env
          docker compose config --quiet

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Determine image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: |
            hkfree-tv:ci
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check container startup
        run: |
          docker run --detach --name app-smoke \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --network host \
            --env HOST=127.0.0.1 \
            --env PORT=4251 \
            --env TRUSTED_PROXY=127.0.0.1 \
            --env USERDB_API_USERNAME=ci \
            --env USERDB_API_PASSWORD=ci \
            --env SLEDOVANITV_PASSWORD=ci \
            hkfree-tv:ci
          for attempt in {1..30}; do
            # Neexistujici cesta overi HTTP server bez volani externich API.
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --max-time 2 http://127.0.0.1:4251/__container_smoke_test__) || status=000
            if [ "$status" = 404 ]; then
              exit 0
            fi
            sleep 1
          done
          docker logs app-smoke
          exit 1
      - name: Remove smoke container
        if: always()
        run: docker rm --force app-smoke || true
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: github.event_name == 'push'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
